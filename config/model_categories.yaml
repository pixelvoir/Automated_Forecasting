# Stage 5 model catalog — the single source of truth for model selection.
#
# Consumed by pipeline/rule_engine.py (eligibility + rule picks), the LLM prompt in
# agents/model_selector_agent.py (when_to_use lines go into the prompt verbatim), and
# later by the Stage 6/7 feature-engineering + training stages (id -> models_lib class).
#
# `available` is NEVER stored here — it is derived at runtime via
# importlib.util.find_spec(import_check) inside the job subprocess, so installing a
# library (e.g. prophet) enables its models with zero config changes.

categories:
  baseline:
    label: "Baseline"
    description: "Cheap benchmarks; also the pick when history is too short for anything else."
  statistical:
    label: "Statistical"
    description: "Classical univariate models (ETS / ARIMA / Theta / MSTL / Prophet)."
  intermittent:
    label: "Intermittent demand"
    description: "Croston-family for sparse demand with many zero periods."
  ml:
    label: "Machine learning"
    description: "Gradient-boosted trees on lag/date features; handles exogenous drivers and global panel training."
  deep_learning:
    label: "Deep learning"
    description: "Neural forecasters (torch NHITS, pretrained Chronos); panel totals count toward their history requirement."

models:
  - id: seasonal_naive
    label: "Seasonal Naive"
    library: statsforecast          # statsforecast.models.SeasonalNaive
    import_check: statsforecast
    categories: [baseline]
    min_length: 3
    supports_exog: false
    when_to_use: >-
      Benchmark, or when history is shorter than ~2 seasonal cycles; repeats the last
      seasonal cycle. Period 1 degenerates to a plain naive (last value) forecast.

  - id: auto_theta
    label: "AutoTheta"
    library: statsforecast          # statsforecast.models.AutoTheta
    import_check: statsforecast
    categories: [statistical]
    min_length: 10
    supports_exog: false
    when_to_use: >-
      Trend-dominant series; deseasonalizes then extrapolates a damped trend. Very
      robust default on short-to-medium history (a top performer in the M-competitions).

  - id: auto_ets
    label: "AutoETS"
    library: statsmodels            # models_lib/statistical.py::AutoETSForecaster
    import_check: statsmodels
    categories: [statistical]
    min_length: 10
    supports_exog: false
    when_to_use: >-
      Exponential smoothing with automatic trend/seasonal selection. Best for trend
      and/or a single seasonality with smooth demand; the multiplicative variants suit
      series whose variance grows with the level (heteroskedastic).

  - id: auto_arima
    label: "AutoARIMA"
    library: pmdarima               # models_lib/statistical.py::AutoARIMAForecaster
    import_check: pmdarima
    categories: [statistical]
    min_length: 30
    supports_exog: false
    when_to_use: >-
      Rich autocorrelation structure (many significant ACF lags) with at most one
      seasonal period <= 24; differencing handles trend. Slow on very long series and
      infeasible for weekly-52 / daily-365 seasonality.

  - id: prophet
    label: "Prophet"
    library: prophet
    import_check: prophet
    categories: [statistical]
    min_length: 20
    supports_exog: false
    when_to_use: >-
      Trend with automatic changepoints plus one or several seasonal cycles — including
      long periods (e.g. yearly-365) where ARIMA is infeasible — and calendar effects;
      robust to gaps and outliers. Point forecasts; intervals come from the conformal
      fallback.

  - id: croston
    label: "Croston (optimized)"
    library: statsforecast          # statsforecast.models.CrostonOptimized
    import_check: statsforecast
    categories: [intermittent]
    min_length: 10
    supports_exog: false
    when_to_use: >-
      Intermittent demand: many zero periods with fairly stable non-zero sizes
      (ADI >= 1.32, CV2 < 0.49). Forecasts demand rate, not individual spikes.

  - id: tsb
    label: "TSB"
    library: statsforecast          # statsforecast.models.TSB
    import_check: statsforecast
    categories: [intermittent]
    min_length: 10
    supports_exog: false
    when_to_use: >-
      Lumpy or obsolescent demand: many zeros AND highly variable non-zero sizes
      (CV2 >= 0.49). Updates its probability estimate every period, so it handles
      demand that is dying out (obsolescence) better than Croston.

  - id: lightgbm
    label: "LightGBM"
    library: lightgbm
    import_check: lightgbm
    categories: [ml]
    min_length: 30
    supports_exog: true
    when_to_use: >-
      Gradient-boosted trees on engineered lag / rolling / calendar / exogenous
      features. Best with long history and usable exogenous drivers, or trained
      globally across a many-series panel (shared patterns beat per-series fits).

  - id: xgboost
    label: "XGBoost"
    library: xgboost
    import_check: xgboost
    categories: [ml]
    min_length: 30
    supports_exog: true
    when_to_use: >-
      Gradient-boosted trees on the same engineered lag / rolling / calendar / exogenous
      features as LightGBM. An alternative ML learner for long history or a many-series
      panel; the rule ladder only ever picks lightgbm, but the user (or LLM) may train
      xgboost instead.

  - id: nhits
    label: "NHITS"
    library: torch                  # pure-torch backend (models_lib/nhits_model.py);
    import_check: torch             # neuralforecast is unusable here (coreforecast segfault)
    categories: [deep_learning]
    min_length: 200
    supports_exog: false
    when_to_use: >-
      Neural hierarchical interpolation: long series (hundreds of points) or large
      panels trained globally — for per-series scope the TOTAL observations across
      all series count toward min_length, so a 1,800-series monthly panel qualifies
      even when each series is short. Needs PyTorch installed.

  - id: chronos
    label: "Chronos (zero-shot)"
    library: chronos-forecasting    # models_lib/chronos_model.py — Amazon pretrained
    import_check: chronos
    categories: [deep_learning]
    min_length: 10
    supports_exog: false
    when_to_use: >-
      Amazon's pretrained transformer — zero-shot inference, no training: a strong
      generalist on regular, pattern-rich series of any length, and cheap even on
      large panels (batched inference). Weak on intermittent / zero-heavy demand;
      cannot use exogenous drivers. First use downloads ~190MB of weights.
