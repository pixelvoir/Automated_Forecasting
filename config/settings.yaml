# LLM provider configuration
# provider: ollama | openai | gemini | groq
#
# ollama  — local, free, no key needed. Best for privacy (nothing leaves the machine).
#           Popular models: llama3.1:8b, mistral:7b, qwen2.5:7b
# groq    — free tier available, very fast inference. Set GROQ_API_KEY in .env.
#           Popular models: llama-3.1-8b-instant, mixtral-8x7b-32768, gemma2-9b-it
# openai  — Set OPENAI_API_KEY in .env. Models: gpt-4o-mini, gpt-4o
# gemini  — Set GEMINI_API_KEY in .env. Models: gemini-1.5-flash, gemini-1.5-pro
#
# Only computed statistics (~200 tokens) are sent — no raw data, no row values.
# Column names ARE included in the payload (unavoidable for recipe keying).
llm:
  provider: "gemini"
  model: "gemini-2.5-flash"
  base_url: "http://localhost:11434/v1"   # only used for ollama (custom endpoint)
  timeout_seconds: 60
  max_retries: 2
  # Recipe generation is a pick-from-enums decision — sampling noise means a different
  # recipe every run. Low-but-nonzero keeps a little judgement flexibility; raise toward
  # 0.6+ only if recipes feel too rigid, drop to 0 for fully repeatable recipes.
  temperature: 0.2

# Confidence thresholds
confidence_threshold: 0.85

# Validation gate thresholds
validation_gate:
  max_row_loss_pct: 15
  min_series_length: 30

# Stage 1: ingestion settings
ingest:
  row_limit: null          # null = fetch all rows; set an integer to cap rows (useful for large tables during dev)
  raw_format: parquet
  top_n_categories: 5      # how many top values to include in cardinality stats

# Stage 2.5: forecast intent detection (runs after pre-clean EDA, before cleaning)
forecast_intent:
  panel_dup_ts_threshold: 0.05 # duplicate-timestamp fraction above which data is a panel
  group_uniqueness_high: 0.995 # (group, ts) uniqueness for high-confidence series key
  group_uniqueness_medium: 0.95
  dimension_max_cardinality: 10000  # event-log mode: max distinct values for a dimension key

# Stage 4: forecasting EDA settings
forecast_eda:
  acf_lags: 40                 # ACF/PACF lags computed and plotted
  entropy_max_points: 2000     # sample/approx entropy are O(n²) — hard cap (most recent points)
  stat_test_max_points: 5000   # ADF/KPSS/PP + structural breaks run on the series tail
  stl_max_points: 50000        # above this, classical decomposition replaces STL (LOESS too slow)
  plot_max_points: 1500        # downsampling cap for chart arrays saved in the full JSON
  top_series_deep_dive: 3      # per-series scope: full stats battery on top-K series by volume

# Stage 5: model selection rule thresholds (catalog lives in model_categories.yaml)
model_selection:
  short_series_length: 20        # R1: below this -> baseline
  low_forecastability: 0.2       # R8: below this (and weak seasonality) -> baseline + warning
  seasonality_strong: 0.6
  seasonality_moderate: 0.3
  trend_strong: 0.6
  min_cycles_for_seasonal: 3     # R6: full seasonal cycles needed before trusting SARIMA/ETS-seasonal
  sarima_max_period: 24          # SARIMA infeasible above this (weekly-52 / daily-365 -> ETS/MSTL path)
  exog_min_abs_corr: 0.4         # lag>=1 |corr| for an exog to enter training_hints.exog_usable
  exog_route_min_abs_corr: 0.5   # stronger bar for exog to ROUTE the decision to ML (R4)
  exog_route_min_length: 100     # below this exog never routes the model choice, only hints
  vif_collinear: 10              # vif_max above this -> collinearity warning
  panel_global_min_series: 30    # R3: panels at/above this route to a global ML model
  panel_global_min_cycles: 2     # R3: median series length (in periods) needed to verify global routing
  intermittent_veto_zero_pct: 20 # croston/tsb INELIGIBLE when class=smooth and zero_pct below this

# Stage 2: pre-cleaning EDA settings
pre_clean_eda:
  outlier_iqr_multiplier: 1.5          # IQR fence multiplier (standard = 1.5, strict = 3.0)
  outlier_zscore_threshold: 3.0        # |z| > this → outlier
  outlier_mad_threshold: 3.0           # |x - median| / MAD > this → outlier
  constant_col_variance_threshold: 0.001  # std/|mean| < this → near-constant
  structural_breaks_min_rows: 50       # skip break detection if fewer rows
  structural_breaks_penalty: "bic"     # ruptures penalty: "bic" | "aic" | "l2"
