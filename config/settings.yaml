# LLM provider configuration
# provider: ollama | openai | gemini | groq
#
# ollama  — local, free, no key needed. Best for privacy (nothing leaves the machine).
#           Popular models: llama3.1:8b, mistral:7b, qwen2.5:7b
# groq    — free tier available, very fast inference. Set GROQ_API_KEY in .env.
#           Popular models: llama-3.1-8b-instant, mixtral-8x7b-32768, gemma2-9b-it
# openai  — Set OPENAI_API_KEY in .env. Models: gpt-4o-mini, gpt-4o
# gemini  — Set GEMINI_API_KEY in .env. Models: gemini-1.5-flash, gemini-1.5-pro
#
# Only computed statistics (~200 tokens) are sent — no raw data, no row values.
# Column names ARE included in the payload (unavoidable for recipe keying).
llm:
  provider: "gemini"
  model: "gemini-3.5-flash"
  base_url: "http://localhost:11434/v1"   # only used for ollama (custom endpoint)
  timeout_seconds: 60
  max_retries: 2
  # Recipe generation is a pick-from-enums decision — sampling noise means a different
  # recipe every run. Low-but-nonzero keeps a little judgement flexibility; raise toward
  # 0.6+ only if recipes feel too rigid, drop to 0 for fully repeatable recipes.
  temperature: 0.2

# Optional separate LLM for the Stage 8 Results-tab insight report. Any field here
# OVERRIDES the main `llm` block for report calls only; omit/empty the whole block to
# reuse `llm` as-is. Key resolution for reports: api_key_env (if set here) →
# REPORT_<PROVIDER>_API_KEY → the provider's standard env var. The report is a long
# prose narrative, so a bigger model + higher timeout + a little more temperature
# than the pick-from-enums agents.
llm_report:
  provider: "groq"
  model: "openai/gpt-oss-120b"
  timeout_seconds: 120
  temperature: 0.4
  # api_key_env: "REPORT_GEMINI_API_KEY"   # uncomment to force a specific env var name

# Confidence thresholds
confidence_threshold: 0.85

# CPU throttling (pipeline/resource_limits.py) — keeps heavy stages from freezing the
# machine. Jobs run slightly slower but the desktop stays responsive.
resources:
  job_priority: normal   # below_normal | normal — OS priority of the job subprocess.
                               # below_normal keeps a small machine usable during heavy
                               # stages, but on hybrid P/E-core CPUs (12th-gen+ Intel
                               # laptops) Windows tends to park below-normal work on the
                               # slow E-cores — if pipeline stages run several times
                               # slower than the hardware suggests, set this to normal.
  max_threads: auto            # auto = all cores minus one; or an integer (BLAS/OpenMP,
                               # LightGBM/XGBoost n_jobs, torch threads all use this cap)

# Validation gate thresholds
validation_gate:
  max_row_loss_pct: 15
  min_series_length: 30
  max_target_sum_drift_pct: 5   # blocking: cleaned target total may drift at most this
                                # far beyond what row loss explains (catches recipes that
                                # clip/winsorize the target and shrink every aggregate)

# Stage 1: ingestion settings
ingest:
  row_limit: null          # null = fetch all rows; set an integer to cap rows (useful for large tables during dev)
  raw_format: parquet
  top_n_categories: 5      # how many top values to include in cardinality stats
  csv_block_size_mb: 64    # CSV→Parquet is streamed in blocks of this size (bounds peak RAM;
                           # a large CSV never lives fully in memory). Lower it on a tight box.

# Stage 2.5: forecast intent detection (runs after pre-clean EDA, before cleaning)
forecast_intent:
  panel_dup_ts_threshold: 0.05 # duplicate-timestamp fraction above which data is a panel
  group_uniqueness_high: 0.995 # (group, ts) uniqueness for high-confidence series key
  group_uniqueness_medium: 0.95
  dimension_max_cardinality: 10000  # event-log mode: max distinct values for a dimension key
  max_target_candidates: 30    # target-dropdown cap (generous — a real measure must never fall off)

# Stage 4: forecasting EDA settings
forecast_eda:
  acf_lags: 40                 # ACF/PACF lags computed and plotted
  entropy_max_points: 2000     # sample/approx entropy are O(n²) — hard cap (most recent points)
  stat_test_max_points: 5000   # ADF/KPSS/PP + structural breaks run on the series tail
  stl_max_points: 50000        # above this, classical decomposition replaces STL (LOESS too slow)
  plot_max_points: 1500        # downsampling cap for chart arrays saved in the full JSON
  top_series_deep_dive: 3      # per-series scope: full stats battery on top-K series by volume

# Stage 5: model selection rule thresholds (catalog lives in model_categories.yaml)
model_selection:
  short_series_length: 20        # R1: below this -> baseline
  low_forecastability: 0.2       # R8: below this (and weak seasonality) -> baseline + warning
  seasonality_strong: 0.6
  seasonality_moderate: 0.3
  trend_strong: 0.6
  min_cycles_for_seasonal: 3     # R6: full seasonal cycles needed before trusting SARIMA/ETS-seasonal
  sarima_max_period: 24          # SARIMA infeasible above this (weekly-52 / daily-365 -> ETS/MSTL path)
  exog_min_abs_corr: 0.4         # lag>=1 |corr| for an exog to enter training_hints.exog_usable
  exog_route_min_abs_corr: 0.5   # stronger bar for exog to ROUTE the decision to ML (R4)
  exog_route_min_length: 100     # below this exog never routes the model choice, only hints
  vif_collinear: 10              # vif_max above this -> collinearity warning
  panel_global_min_series: 30    # R3: panels at/above this route to a global ML model
  panel_global_min_cycles: 2     # R3: median series length (in periods) needed to verify global routing
  intermittent_veto_zero_pct: 20 # croston/tsb INELIGIBLE when class=smooth and zero_pct below this
  llm_demote_margin: 1.5         # LLM demoting a HIGH-confidence rule #1: reverted when its
                                 # rule-suitability score is more than this below the rule pick's
                                 # (~one strong reason); otherwise kept at medium confidence

# Stage 6: feature engineering (deterministic, EDA-seeded — no LLM). Only the ML models
# (lightgbm/xgboost) actually consume the engineered matrix; the classical/statsforecast
# models train on the raw series. The recipe is derived from the Stage 4 EDA output.
feature_engineering:
  max_lags: 12                 # cap on lag features taken from significant ACF lags
  fourier_order: 3             # sin/cos harmonics per seasonal period
  rolling_windows_extra: []    # extra rolling windows beyond the primary period (e.g. [3])
  holiday_country: null        # ISO code (e.g. "IN") for is_holiday; needs the optional `holidays` pkg

# Stage 7: model training. Walk-forward CV window count adapts to series length; large
# panels shrink the window count and Optuna budget so training stays bounded.
training:
  cv_windows: 3                # rolling-origin windows on a normal-length series
  cv_windows_large_panel: 1    # windows once n_series >= large_panel_series
  min_train_multiple: 2        # min train length floor = this * seasonal period
  test_holdout_fraction: 0.15  # single-holdout fallback when the series is too short for CV
  interval_levels: [80, 95]    # prediction-interval coverage levels (ML quantile / conformal)
  # Accuracy vs time budget — the user accepted longer training for better results.
  # fast: no tuning, small budgets; balanced: default; max: 1-3h-class training.
  accuracy_profile: balanced
  profiles:
    fast:     {optuna_trials: 0,   early_stopping_rounds: 50,  nhits_max_epochs: 60,  patchtst_max_epochs: 40}
    balanced: {optuna_trials: 30,  early_stopping_rounds: 80,  nhits_max_epochs: 200, patchtst_max_epochs: 150}
    max:      {optuna_trials: 100, early_stopping_rounds: 120, nhits_max_epochs: 500, patchtst_max_epochs: 400}
  optuna_trials_large: 8       # override once n_series >= large_panel_series (any profile)
  max_train_rows: 1500000      # stratified (series, horizon) subsample cap for huge panels
  max_models_per_run: 5        # hard cap on models trained simultaneously (baseline excluded)
  # Weighted ensemble of the requested models (free leaderboard row: components are
  # already trained; crownable if it wins MASE). Weights minimize backtest MAE under
  # w >= 0, sum(w) = 1 (SLSQP), with inverse-MASE and equal-weight fallbacks and
  # small-sample shrinkage toward equal. Legacy key `ensemble_top2: false` still disables.
  ensemble:
    enabled: true
    max_members: 5               # cap on component models (best-MASE first)
    mase_factor: 1.5             # exclude members with MASE > factor x best member
    exclude_worse_than_baseline: true  # exclude members not beating the seasonal-naive row
    min_shared_points: 3         # fewer shared backtest timestamps -> no ensemble row
    min_points_per_member: 3     # prune members until shared points >= this x members
    shrink_points_per_member: 3  # below this x members, weights shrink toward equal
  chronos_variant: "amazon/chronos-bolt-small"  # HF model id for the zero-shot chronos backend
  per_series_cap: 200          # any per-series-routed model fits only the top-K series by volume
  large_panel_series: 500      # n_series at/above this triggers the large-data reductions
  # Cost tiers from ESTIMATED WALL-CLOCK MINUTES (trainer.estimate_cost — work-based
  # priors calibrated by models/timing_calibration.json after every run):
  tier_minutes:
    moderate: 2                # above this -> "moderate"
    heavy: 15                  # above this -> "heavy" (requires confirm_heavy)
  plot_max_points: 1500        # downsample cap for backtest/forecast arrays in the report

# Stage 2: pre-cleaning EDA settings
pre_clean_eda:
  outlier_iqr_multiplier: 1.5          # IQR fence multiplier (standard = 1.5, strict = 3.0)
  outlier_zscore_threshold: 3.0        # |z| > this → outlier
  outlier_mad_threshold: 3.0           # |x - median| / MAD > this → outlier
  constant_col_variance_threshold: 0.001  # std/|mean| < this → near-constant
  structural_breaks_min_rows: 50       # skip break detection if fewer rows
  structural_breaks_penalty: "bic"     # ruptures penalty: "bic" | "aic" | "l2"
